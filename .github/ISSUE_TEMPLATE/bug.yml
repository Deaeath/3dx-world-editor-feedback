name: Bug report
description: Something in the editor doesn't work the way it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Click ...\n3. ..."
  - type: textarea
    id: details
    attributes:
      label: Editor details
      description: Version, browser, world. The editor's Feedback button fills this in.
